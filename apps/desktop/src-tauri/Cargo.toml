[package]
name = "bigfatfish-desktop"
version = "0.1.0"
description = "BigFatFish desktop runtime connection"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
